name: Discover Host

# 一次性只读排查：确认自托管 Runner 所在机器上，应用是哪个目录、用什么方式托管、监听哪个端口。
# 结果直接看本次运行日志，用来核对仓库变量 DEPLOY_PATH / DEPLOY_SERVICE / DEPLOY_HEALTH_URL。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: 主机信息
        run: |
          echo '== 系统 =='
          head -3 /etc/os-release

          echo '== 应用进程（含工作目录）=='
          for pid in $(pgrep -f 'scripts/start.mjs' || true); do
            echo "PID $pid cwd=$(readlink -f /proc/$pid/cwd)"
            tr '\0' ' ' < "/proc/$pid/cmdline"; echo
          done

          echo '== 监听端口 =='
          ss -lntp 2>/dev/null | grep -E ':(3000|3210|8080|80|443)' || echo '未发现相关端口'

          echo '== systemd 单元 =='
          systemctl list-units --type=service --no-pager 2>/dev/null | grep -Ei 'node|qtb|qiantu' || echo '未发现相关服务'

          echo '== 健康检查 =='
          for url in http://127.0.0.1:3000/readyz http://127.0.0.1:3210/readyz; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$url" 2>/dev/null || true)
            echo "$url -> ${code:-不可用}"
          done
