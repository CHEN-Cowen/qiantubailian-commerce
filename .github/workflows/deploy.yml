name: Deploy

# 只允许手动触发，且必须输入 confirm=deploy；不会随 push 自动上线。
# 运行在服务器上的 Linux 自托管 Runner 中，因此不需要 SSH、密钥或开放端口。
# 首次使用：仓库 Settings → Actions → Runners → New self-hosted runner，按页面命令安装并启动。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的分支、标签或提交
        required: true
        default: master
      confirm:
        description: 输入 deploy 以确认本次为生产部署
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 验证并部署到本机
    if: github.event.inputs.confirm == 'deploy'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - name: 检出待部署代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm

      - name: 按锁文件安装依赖
        run: npm ci --no-audit --no-fund

      - name: 语法与静态检查
        run: npm run check

      - name: 全量测试
        run: npm test

      - name: 启动冒烟
        run: npm run smoke

      - name: 检查部署变量
        run: |
          [ -n "$DEPLOY_PATH" ] || { echo "缺少仓库变量 DEPLOY_PATH（Settings → Secrets and variables → Actions → Variables）" >&2; exit 1; }
          [ -n "$DEPLOY_SERVICE" ] || { echo "缺少仓库变量 DEPLOY_SERVICE（systemd 服务名，如 qiantubailian）" >&2; exit 1; }

      - name: 打包（只含版本库内文件）
        run: |
          archive="$RUNNER_TEMP/qtb-release.tgz"
          git archive --format=tar.gz -o "$archive" HEAD
          ls -lh "$archive"

      - name: 解包、安装、重启并健康检查
        run: |
          bash scripts/deploy-linux.sh \
            "$DEPLOY_PATH" \
            "$RUNNER_TEMP/qtb-release.tgz" \
            "$DEPLOY_SERVICE" \
            "${DEPLOY_HEALTH_URL:-http://127.0.0.1:3000/readyz}"
