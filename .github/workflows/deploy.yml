name: Deploy

# 只允许手动触发，且必须输入 confirm=deploy；不会随 push 自动上线。
# 目标机为 Windows 单实例 Node 服务：OpenSSH Server + 进程托管（Windows 服务 / NSSM / pm2 / 计划任务）。
# 远端实际动作见 scripts/deploy-windows.ps1。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的分支、标签或提交
        required: true
        default: master
      confirm:
        description: 输入 deploy 以确认本次为生产部署
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 验证并部署到 Windows
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_RESTART_MODE: ${{ secrets.DEPLOY_RESTART_MODE }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
    steps:
      - name: 检查部署配置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH DEPLOY_SERVICE; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少部署配置:$missing（在仓库 Settings → Secrets and variables → Actions 中配置）"
            exit 1
          fi

      - name: 检出待部署代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm

      - name: 按锁文件安装依赖
        run: npm ci --no-audit --no-fund

      - name: 语法与静态检查
        run: npm run check

      - name: 全量测试
        run: npm test

      - name: 启动冒烟
        run: npm run smoke

      - name: 打包（只含版本库内文件）
        run: git archive --format=tar.gz -o release.tgz HEAD

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 上传发布包与部署脚本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "${DEPLOY_PORT:-22}" -i ~/.ssh/deploy_key release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:qtb-release.tgz"
          scp -P "${DEPLOY_PORT:-22}" -i ~/.ssh/deploy_key scripts/deploy-windows.ps1 \
            "$DEPLOY_USER@$DEPLOY_HOST:qtb-deploy.ps1"

      - name: 远端解包、安装、重启并健康检查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "powershell -NoProfile -ExecutionPolicy Bypass -File qtb-deploy.ps1 -TargetPath $DEPLOY_PATH -ServiceName $DEPLOY_SERVICE -RestartMode ${DEPLOY_RESTART_MODE:-auto} -HealthUrl ${DEPLOY_HEALTH_URL:-http://127.0.0.1:3000/readyz}"
